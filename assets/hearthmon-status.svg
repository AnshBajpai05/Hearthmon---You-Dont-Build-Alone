<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="188" viewBox="0 0 480 188" role="img" aria-label="Hearthmon — back with this one">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1530"/>
      <stop offset="50%"  stop-color="#201c38"/>
      <stop offset="100%" stop-color="#251e40"/>
    </linearGradient>

    <!-- Sprite glow -->
    <radialGradient id="sprGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%"   stop-color="#f0b66a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f0b66a" stop-opacity="0"/>
    </radialGradient>

    <!-- Snow-globe ground glow (echoes the Alive renderer's lit base; type-tinted) -->
    <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e6c489" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#e6c489" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e6c489" stop-opacity="0"/>
    </radialGradient>

    <!-- Aurora blobs -->
    <radialGradient id="aur1" cx="20%" cy="40%" r="45%">
      <stop offset="0%"   stop-color="#7b5ea7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7b5ea7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="80%" cy="60%" r="40%">
      <stop offset="0%"   stop-color="#5468c4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5468c4" stop-opacity="0"/>
    </radialGradient>

    <!-- Chip glint -->
    <linearGradient id="chipGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="50%"  stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    

    <style>
      /*
       * ── SPRITE MOVEMENT SYSTEM ───────────────────────────────────────────
       */

      /* gentle, BOUNDED idle: a small drift left/right + a little hop — never leaves the card */
      .monWrap {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: monSway 11s ease-in-out infinite;
      }

      .mon {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: monBreathe 3.8s ease-in-out infinite;
        image-rendering: pixelated;
      }

      .shadow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadowSway 11s ease-in-out infinite;
      }

      @keyframes monSway {
        0%   { transform: translate(0,0)       rotate(0deg); }
        14%  { transform: translate(-4px,0)    rotate(-1.2deg); }
        26%  { transform: translate(-3px,-7px) rotate(0deg); }
        34%  { transform: translate(0,0)       rotate(0deg); }
        54%  { transform: translate(4px,0)     rotate(1.2deg); }
        66%  { transform: translate(3px,-7px)  rotate(0deg); }
        74%  { transform: translate(0,0)       rotate(0deg); }
        100% { transform: translate(0,0)       rotate(0deg); }
      }
      @keyframes shadowSway {
        0%,100% { transform: translateX(0)    scale(1);    opacity: 0.32; }
        14%     { transform: translateX(-4px) scale(1);    opacity: 0.32; }
        26%     { transform: translateX(-3px) scale(0.78); opacity: 0.2; }
        34%     { transform: translateX(0)    scale(1);    opacity: 0.32; }
        54%     { transform: translateX(4px)  scale(1);    opacity: 0.32; }
        66%     { transform: translateX(3px)  scale(0.78); opacity: 0.2; }
        74%     { transform: translateX(0)    scale(1);    opacity: 0.32; }
      }
      /* a heart drifts up every ~12s — CSS-only so it animates on GitHub (README
         cards render as images, which have no hover/pointer events) */
      .heart {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: heartFloat 12s ease-out infinite;
      }
      @keyframes heartFloat {
        0%   { opacity: 0; transform: translateY(0) scale(0.4); }
        3%   { opacity: 1; transform: translateY(-8px) scale(1.1); }
        10%  { opacity: 0; transform: translateY(-34px) scale(0.8); }
        100% { opacity: 0; transform: translateY(-34px) scale(0.8); }
      }

      .sprGlow {
        transform-box: fill-box;
        transform-origin: center;
        animation: glowPulse 4s ease-in-out infinite;
      }

      .gstar { animation-name: gtwinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
      @keyframes gtwinkle { 0%,100% { opacity: 0.18; } 50% { opacity: 1; } }
      .pt { opacity: 0; animation: rise 4.4s ease-in-out infinite; }
      .bub { animation: bubFloat 5s ease-in-out infinite; }
      .aur  { animation: aurDrift  12s ease-in-out infinite alternate; }
      .aur2 { animation: aurDrift2 14s ease-in-out infinite alternate; }
      .chip     { animation: chipPulse 6s ease-in-out infinite; }
      .chipshine{ animation: chipSweep 6s ease-in-out infinite; }
      .label  { animation: labelTwinkle 8s ease-in-out infinite; }
      .footer { animation: footerPulse  7s ease-in-out infinite; }
      .borderShimmer { animation: borderPulse 4s ease-in-out infinite; }
      .nameShimmer { animation: namePulse 6s ease-in-out infinite; }

      @keyframes monBreathe {
        0%,100% { transform: scaleX(1)    scaleY(1)    translateY(0);    }
        40%     { transform: scaleX(0.97) scaleY(1.04) translateY(-2px); }
        70%     { transform: scaleX(1.01) scaleY(0.99) translateY(0);    }
      }

      @keyframes glowPulse {
        0%,100% { opacity: 0.5; transform: scale(1);    }
        50%     { opacity: 0.85; transform: scale(1.06); }
      }
      @keyframes rise {
        0%   { opacity: 0;   transform: translateY(0px)   rotate(0deg);  }
        15%  { opacity: 0.9; }
        80%  { opacity: 0.3; }
        100% { opacity: 0;   transform: translateY(-36px) rotate(25deg); }
      }
      @keyframes bubFloat {
        0%,100% { transform: translateY(0px);  opacity: 1;    }
        40%     { transform: translateY(-2px); opacity: 1;    }
        70%     { transform: translateY(-1px); opacity: 0.92; }
      }
      @keyframes aurDrift  {
        0%   { transform: translate(0px,  0px);  }
        50%  { transform: translate(18px, 8px);  }
        100% { transform: translate(4px,  14px); }
      }
      @keyframes aurDrift2 {
        0%   { transform: translate(0px,   0px);  }
        50%  { transform: translate(-12px, -6px); }
        100% { transform: translate(-4px,  10px); }
      }
      @keyframes chipPulse {
        0%,100% { opacity: 1;    }
        50%     { opacity: 0.75; }
      }
      @keyframes chipSweep {
        0%,100% { fill-opacity: 0;    }
        50%     { fill-opacity: 0.55; }
      }
      @keyframes labelTwinkle {
        0%,100% { opacity: 1;    }
        48%     { opacity: 1;    }
        50%     { opacity: 0.5;  }
        52%     { opacity: 1;    }
        75%     { opacity: 0.85; }
      }
      @keyframes footerPulse {
        0%,100% { opacity: 0.6; }
        50%     { opacity: 0.9; }
      }
      @keyframes borderPulse {
        0%,100% { stroke-opacity: 0.3; }
        50%     { stroke-opacity: 0.8; }
      }
      @keyframes namePulse {
        0%,100% { fill: #f6f1ff; text-shadow: 0 0 0px rgba(255,255,255,0); }
        50%     { fill: #ffffff; text-shadow: 0 0 6px rgba(255,255,255,0.4); }
      }
      
      
    </style>
  </defs>

  <!-- Base card fill -->
  <rect width="480" height="188" rx="16" fill="url(#bg)"/>

  <!-- Aurora blobs -->
  <ellipse class="aur"  cx="90"  cy="70"  rx="160" ry="100" fill="url(#aur1)"/>
  <ellipse class="aur2" cx="380" cy="110" rx="140" ry="90"  fill="url(#aur2)"/>

  <!-- Border -->
  <rect class="borderShimmer" x="0.5" y="0.5" width="479" height="187" rx="16"
        fill="none" stroke="#f0b66a" stroke-width="1.5"/>

  <!-- Sprite glow -->
  <ellipse class="sprGlow" cx="78" cy="96" rx="120" ry="108" fill="url(#sprGlow)"/>

  <!-- "Snow-globe" ground: glowing base + faint orbit rings + a twinkling orbital star band -->
  <ellipse cx="78" cy="150" rx="64" ry="19" fill="url(#groundGlow)"/><ellipse cx="78" cy="150" rx="40" ry="11" fill="#e6c489" fill-opacity="0.16"/><ellipse cx="78" cy="150" rx="55" ry="13" fill="none" stroke="#e6c489" stroke-opacity="0.18" stroke-width="1"/><ellipse cx="78" cy="150" rx="34" ry="8"  fill="none" stroke="#e6c489" stroke-opacity="0.13" stroke-width="1"/><circle class="gstar" cx="65.2" cy="158.8" r="2.0" fill="#e6c489" opacity="0.7" style="animation-delay:3.01s;animation-duration:2.2s"/><circle class="gstar" cx="44.0" cy="140.1" r="0.7" fill="#e6c489" opacity="0.7" style="animation-delay:0.48s;animation-duration:2.8s"/><circle class="gstar" cx="86.4" cy="140.4" r="0.7" fill="#e6c489" opacity="0.7" style="animation-delay:2.49s;animation-duration:2.1s"/><circle class="gstar" cx="114.4" cy="151.3" r="1.7" fill="#e6c489" opacity="0.7" style="animation-delay:0.45s;animation-duration:2.0s"/><circle class="gstar" cx="54.0" cy="163.5" r="2.2" fill="#e6c489" opacity="0.7" style="animation-delay:1.26s;animation-duration:3.2s"/><circle class="gstar" cx="138.3" cy="149.0" r="1.5" fill="#ffffff" opacity="0.7" style="animation-delay:0.17s;animation-duration:2.3s"/><circle class="gstar" cx="129.0" cy="148.8" r="1.4" fill="#ffffff" opacity="0.7" style="animation-delay:2.03s;animation-duration:2.6s"/><circle class="gstar" cx="74.4" cy="159.2" r="2.2" fill="#e6c489" opacity="0.7" style="animation-delay:1.47s;animation-duration:2.3s"/><circle class="gstar" cx="114.3" cy="157.9" r="1.9" fill="#e6c489" opacity="0.7" style="animation-delay:0.70s;animation-duration:2.3s"/><circle class="gstar" cx="134.5" cy="149.9" r="1.6" fill="#ffffff" opacity="0.7" style="animation-delay:1.73s;animation-duration:2.8s"/><circle class="gstar" cx="46.4" cy="137.9" r="1.0" fill="#e6c489" opacity="0.7" style="animation-delay:2.05s;animation-duration:2.3s"/><circle class="gstar" cx="92.9" cy="147.1" r="1.2" fill="#ffffff" opacity="0.7" style="animation-delay:1.48s;animation-duration:2.0s"/><circle class="gstar" cx="74.0" cy="135.6" r="0.8" fill="#e6c489" opacity="0.7" style="animation-delay:0.91s;animation-duration:2.4s"/><circle class="gstar" cx="98.5" cy="155.2" r="2.2" fill="#e6c489" opacity="0.7" style="animation-delay:2.00s;animation-duration:2.1s"/><circle class="gstar" cx="36.7" cy="146.2" r="1.4" fill="#e6c489" opacity="0.7" style="animation-delay:2.69s;animation-duration:2.5s"/><circle class="gstar" cx="59.1" cy="150.0" r="1.3" fill="#ffffff" opacity="0.7" style="animation-delay:0.36s;animation-duration:2.4s"/><circle class="gstar" cx="31.6" cy="138.6" r="0.9" fill="#e6c489" opacity="0.7" style="animation-delay:2.68s;animation-duration:3.6s"/><circle class="gstar" cx="78.5" cy="166.2" r="2.4" fill="#ffffff" opacity="0.7" style="animation-delay:2.72s;animation-duration:2.7s"/><circle class="gstar" cx="54.9" cy="135.3" r="0.6" fill="#e6c489" opacity="0.7" style="animation-delay:3.06s;animation-duration:2.5s"/><circle class="gstar" cx="125.2" cy="149.3" r="1.2" fill="#e6c489" opacity="0.7" style="animation-delay:1.06s;animation-duration:2.9s"/><circle class="gstar" cx="74.5" cy="151.1" r="2.0" fill="#ffffff" opacity="0.7" style="animation-delay:0.58s;animation-duration:3.1s"/><circle class="gstar" cx="100.5" cy="152.8" r="1.6" fill="#ffffff" opacity="0.7" style="animation-delay:3.00s;animation-duration:3.6s"/><circle class="gstar" cx="26.9" cy="155.2" r="1.9" fill="#e6c489" opacity="0.7" style="animation-delay:2.08s;animation-duration:3.3s"/><circle class="gstar" cx="45.5" cy="140.6" r="1.0" fill="#e6c489" opacity="0.7" style="animation-delay:3.36s;animation-duration:3.3s"/><circle class="gstar" cx="29.3" cy="140.2" r="0.8" fill="#e6c489" opacity="0.7" style="animation-delay:2.42s;animation-duration:3.6s"/><circle class="gstar" cx="50.2" cy="152.9" r="1.6" fill="#e6c489" opacity="0.7" style="animation-delay:2.72s;animation-duration:2.5s"/><circle class="gstar" cx="63.6" cy="151.8" r="2.0" fill="#ffffff" opacity="0.7" style="animation-delay:2.07s;animation-duration:3.3s"/><circle class="gstar" cx="50.6" cy="142.8" r="1.0" fill="#ffffff" opacity="0.7" style="animation-delay:3.18s;animation-duration:3.3s"/><circle class="gstar" cx="104.3" cy="156.9" r="1.9" fill="#ffffff" opacity="0.7" style="animation-delay:0.37s;animation-duration:3.2s"/><circle class="gstar" cx="19.4" cy="144.3" r="0.9" fill="#e6c489" opacity="0.7" style="animation-delay:0.79s;animation-duration:3.3s"/><circle class="gstar" cx="96.6" cy="138.8" r="0.6" fill="#ffffff" opacity="0.7" style="animation-delay:0.65s;animation-duration:2.6s"/><circle class="gstar" cx="95.8" cy="145.5" r="0.7" fill="#e6c489" opacity="0.7" style="animation-delay:2.20s;animation-duration:3.0s"/><circle class="gstar" cx="21.5" cy="151.1" r="1.6" fill="#e6c489" opacity="0.7" style="animation-delay:2.42s;animation-duration:2.5s"/><circle class="gstar" cx="113.3" cy="138.9" r="1.0" fill="#ffffff" opacity="0.7" style="animation-delay:0.02s;animation-duration:3.6s"/><circle class="gstar" cx="46.8" cy="137.3" r="0.7" fill="#ffffff" opacity="0.7" style="animation-delay:1.22s;animation-duration:3.0s"/><circle class="gstar" cx="21.2" cy="153.6" r="1.6" fill="#ffffff" opacity="0.7" style="animation-delay:2.89s;animation-duration:3.6s"/><circle class="gstar" cx="99.5" cy="158.6" r="2.0" fill="#e6c489" opacity="0.7" style="animation-delay:0.63s;animation-duration:3.1s"/><circle class="gstar" cx="23.9" cy="157.0" r="1.7" fill="#ffffff" opacity="0.7" style="animation-delay:0.16s;animation-duration:2.5s"/><circle class="gstar" cx="46.0" cy="162.8" r="2.2" fill="#e6c489" opacity="0.7" style="animation-delay:0.53s;animation-duration:2.2s"/><circle class="gstar" cx="57.2" cy="142.1" r="1.0" fill="#ffffff" opacity="0.7" style="animation-delay:2.03s;animation-duration:2.1s"/><circle class="gstar" cx="53.0" cy="138.6" r="0.6" fill="#ffffff" opacity="0.7" style="animation-delay:2.92s;animation-duration:2.6s"/><circle class="gstar" cx="133.8" cy="150.9" r="1.5" fill="#e6c489" opacity="0.7" style="animation-delay:0.19s;animation-duration:2.2s"/><circle class="gstar" cx="141.5" cy="152.0" r="1.5" fill="#e6c489" opacity="0.7" style="animation-delay:1.03s;animation-duration:2.9s"/><circle class="gstar" cx="64.0" cy="157.0" r="2.4" fill="#e6c489" opacity="0.7" style="animation-delay:0.35s;animation-duration:3.3s"/><circle class="gstar" cx="67.9" cy="147.4" r="0.8" fill="#ffffff" opacity="0.7" style="animation-delay:3.21s;animation-duration:3.0s"/><circle class="gstar" cx="122.5" cy="155.2" r="1.6" fill="#ffffff" opacity="0.7" style="animation-delay:3.18s;animation-duration:2.6s"/><circle class="gstar" cx="29.7" cy="139.6" r="0.8" fill="#ffffff" opacity="0.7" style="animation-delay:0.15s;animation-duration:3.0s"/><circle class="gstar" cx="116.1" cy="136.4" r="0.7" fill="#e6c489" opacity="0.7" style="animation-delay:1.48s;animation-duration:3.5s"/><ellipse class="sprGlow" cx="78" cy="150" rx="9" ry="4" fill="#ffffff" fill-opacity="0.85"/><circle cx="78" cy="150" r="1.8" fill="#ffffff"/>

  <!-- Ground contact shadow (synced to monMove) -->
  <ellipse class="shadow" cx="78" cy="152" rx="40" ry="6" fill="#000" fill-opacity="0.3"/>

  <!-- Sparkle particles -->
  <text class="pt" x="38" y="118" font-size="10" fill="#f0b66a" style="animation-duration:3.8s;animation-delay:0s">✦</text><text class="pt" x="62" y="108" font-size="8" fill="#f0b66a" style="animation-duration:4.3s;animation-delay:1.1s">✦</text><text class="pt" x="90" y="122" font-size="10" fill="#f0b66a" style="animation-duration:4.7s;animation-delay:2.1s">✦</text><text class="pt" x="52" y="130" font-size="14" fill="#f0b66a" style="animation-duration:5.2s;animation-delay:0.55s">·</text><text class="pt" x="108" y="112" font-size="9" fill="#f0b66a" style="animation-duration:5.6s;animation-delay:3.0s">✧</text><text class="pt" x="76" y="105" font-size="12" fill="#f0b66a" style="animation-duration:6.0s;animation-delay:1.7s">·</text><text class="pt" x="44" y="95" font-size="7" fill="#f0b66a" style="animation-duration:6.5s;animation-delay:3.8s">✦</text>

  <!-- Type-based ambient effect (lightning / fire / rays / …) — behind the pet -->
  

  <!-- Sprite (bigger, grounded near the shadow) -->
  <g transform="translate(23,42)">
    <g class="monWrap">
      <text class="mon" x="55" y="82" font-size="62" text-anchor="middle">🐾</text>
    </g>
  </g>

  <!-- Affection heart — drifts up every ~12s (visible on GitHub) -->
  <text class="heart" x="78" y="88" font-size="20" text-anchor="middle" fill="#ff7aa8">❤</text>

  <!-- Current partner, labelled right under the companion -->
  <text x="78" y="170" font-size="10.5" text-anchor="middle" fill="#8d82ab">currently beside you · <tspan fill="#f0b66a" font-weight="700">Donphan</tspan></text>

  <!-- Speech bubble — a thought, nudged toward the companion with a long soft tail -->
  <g class="bub">
    <rect x="116" y="14" rx="11" width="158" height="28"
          fill="#160f24" fill-opacity="0.95" stroke="#f0b66a" stroke-opacity="0.45" stroke-width="1"/>
    <rect x="120" y="16" rx="6"  width="150" height="6"
          fill="white" fill-opacity="0.05"/>
    <path d="M124 42 q -7 17 -26 22 q 19 -2 30 -12 z" fill="#160f24" fill-opacity="0.95"/>
    <text x="130" y="33" font-size="12" fill="#e9e2fb">back with this one</text>
  </g>

  <!-- Layer 2: title (the product) + the money line as its identity -->
  <text class="nameShimmer" x="168" y="68" font-size="23" font-weight="800">✦ Hearthmon</text>
  <text x="168" y="92" font-size="14.5" fill="#f0b66a" font-weight="600">for the long nights between stuck</text>
  <text x="168" y="111" font-size="14.5" fill="#f0b66a" font-weight="600">and breakthrough</text>

  <!-- Layer 3: narrative aliveness chips -->
  <g class="chip" style="animation-delay:0s"><rect x="168" y="126" rx="10" width="131" height="21" fill="#f0b66a" fill-opacity="0.1" stroke="#f0b66a" stroke-opacity="0.45"/><rect x="168" y="126" rx="10" width="131" height="21" fill="url(#chipGlint)" fill-opacity="0" class="chipshine"/><text x="233" y="140" font-size="11" fill="#f0b66a" text-anchor="middle">🫖 slow and steady</text></g><g class="chip" style="animation-delay:0.6s"><rect x="305.5" y="126" rx="10" width="118" height="21" fill="#f0b66a" fill-opacity="0.1" stroke="#f0b66a" stroke-opacity="0.45"/><rect x="305.5" y="126" rx="10" width="118" height="21" fill="url(#chipGlint)" fill-opacity="0" class="chipshine"/><text x="365" y="140" font-size="11" fill="#f0b66a" text-anchor="middle">🛠 still shaping</text></g>

  <!-- Layer 4: a soft call + factual counterweight, clustered together on the right -->
  <text class="footer" x="462" y="177" text-anchor="end">
    <tspan font-size="11" fill="#f0b66a" fill-opacity="0.9">still here</tspan>
    <tspan font-size="10" fill="#8d82ab"> · learning how to stay</tspan>
  </text>

</svg>