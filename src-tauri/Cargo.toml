[package]
name = "hearthmon"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hearthmon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE (security_audit #1): do NOT add the "devtools" feature here. Without it, release builds
# have no webview devtools (Tauri only enables them in debug). Keep it off for shipped beta.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
# Auto-update (V2's first online feature): check GitHub Releases for a newer signed build,
# download + verify (minisign pubkey in tauri.conf), install, then relaunch. `process` provides
# the relaunch the updater needs. Friend distribution moves portable .exe -> NSIS setup installer.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"

# Audio-class vote (YAMNet): pure-Rust ONNX inference of the YAMNet MobileNet core (mel patch ->
# 521 AudioSet scores) to separate SPEECH from MUSIC, which audio heuristics provably can't. No
# native/C dep, nothing to ship beside the .exe. Log-mel preprocessing is hand-written in Rust so
# raw audio never leaves the process. Model in resources/yamnet/.
tract-onnx = "0.21"
rustfft = "6"  # log-mel front-end (STFT) for the YAMNet vote — pure Rust, matches TF to 1e-5

# Chapter Access (secure_Hearthmon): offline, device-bound chapter/license gate.
# All cross-platform; the only OS-specific piece (registry I/O) is winreg below.
sha2 = "0.10"               # MachineGuid → machine hash
hmac = "0.12"               # builder-pass signature (HMAC-SHA256)
hex = "0.4"                 # hex encode/decode
hkdf = "0.12"               # derive the state-encryption key from secret + machine hash
chacha20poly1305 = "0.10"   # AEAD: encrypt + authenticate the state blob
getrandom = "0.2"           # AEAD nonce
base64 = "0.22"             # store the opaque blob as text
chrono = { version = "0.4", features = ["clock"] }  # end-of-local-day pass expiry
obfstr = "0.4"              # keep the build-time secret out of `strings`

# Flow awareness: read the FOREGROUND app's process name (name only — never the
# window title, keystrokes, or content) to sense flow vs. friction.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }
# Layer 2 audio-source: WASAPI audio-session enumeration (which PROCESS is emitting sound) needs the
# COM-ergonomic `windows` crate (windows-sys is too raw for the Core Audio interfaces). Process-name
# only; no audio is read here — just "spotify.exe is the loudest session" → music.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }
# Music awareness: WASAPI loopback of system OUTPUT (opt-in; ephemeral energy only,
# never records or stores audio). Building an INPUT stream on the default OUTPUT
# device gives loopback capture on Windows.
cpal = "0.15"
# Chapter Access: read HKLM MachineGuid + read/write the HKCU state store.
winreg = "0.52"

# security_audit #3: strip symbols from shipped binaries — smaller, and modestly harder for the
# debugger crowd to map the gate/secret. (No effect on `cargo check`/dev builds.)
[profile.release]
strip = true

